services:
  wordpress:
    image: wordpress
    ports:
      - "8089:80"
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "admin"
      WORDPRESS_DB_NAME: wordpress
    networks:
      local:
        ipv4_address: "10.56.1.21"
  mysql:
    image: mysql
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ROOT_PASSWORD: "admin"
    volumes:
      - ./mysql_wordpress:/var/lib/mysql
    networks:
      local:
        ipv4_address: "10.56.1.20"
networks:
  local:
    driver: bridge
    ipam:
      config:
        - subnet: "10.56.1.0/24"